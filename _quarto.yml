project:
  type: website
  pre-render: python scripts/pre.py slides
  post-render: python scripts/post.py slides

  render:
    - "*.qmd"
    - "!*.md"


  resources:
    - img
    - "site-page-content/*.pdf"
    - "slides/Wrap-up.pdf"
    - assets

