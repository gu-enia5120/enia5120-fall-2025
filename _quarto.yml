format:
  html:
    theme:
      light: [cerulean, brand, style/html-sta313-adg.scss, style/sfah.scss]
      dark: [cerulean, brand, style/html-sta313-adg.scss, style/html-dark.scss, style/sfah.scss]
    toc: true
    linkcolor: "#866fa3" # Glossy Grape
    embed-resources: true
    code-copy: true
    code-overflow: wrap
    mainfont: "Atkinson Hyperlegible"
    link-external-icon: true
    link-external-newwindow: true

execute:
  warning: false
  message: false
  freeze: auto
  cache: true
  eval: true
  echo: false
